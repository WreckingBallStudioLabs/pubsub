name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Label of the container job
  container-job:
    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest
    # Docker Hub image that `container-job` executes in
    container: golang

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      nats:
        # Docker Hub image
        image: nats
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Downloads a copy of the code in your repository before running CI tests
      - name: Check out repository code
        uses: actions/checkout@v3
        
      - name: Setup Go environment
        uses: actions/setup-go@v4.0.0
        with:
          # The Go version to download (if necessary) and use. Supports semver spec and ranges.
          # sypl v2 requires go >= 1.23, so go mod tidy raised the module's go directive to 1.23.
          go-version: "1.23"
          cache: true

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v3.1.0
        with:
          version: v1.58.2 
          args: --timeout 10m -v -c .golangci.yml

      - name: Test
        run: |
          curl -s https://raw.githubusercontent.com/thalesfsp/configurer/main/resources/install.sh | sh
          make test coverage
          
      - name: Integration test
        run: |
          curl -s https://raw.githubusercontent.com/thalesfsp/configurer/main/resources/install.sh | sh
          sleep 10
          make test-integration coverage
